<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>complete responsive tour and travel agency website design tutorial</title>

    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />

    <!-- font awesome cdn link  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <!-- custom css file link  -->
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <div class="register-form-container">

        <form action="connect.php" method="post">
            <h3>Register</h3>
            <input type="text" class="box" placeholder="Enter your First name" id="firstName" name="firstName" required>
            <input type="text" class="box" placeholder="Enter your Last name" id="lastName" name="lastName" required>
            <div class="gender">
                <label for="male" class="radio-inline"><input type="radio" id="male" name="gender" value="male" required>Male</label>
                <label for="female" class="radio-inline"><input type="radio" id="female" name="gender" value="female">Female</label>
                <label for="other" class="radio-inline"><input type="radio" id="other" name="gender" value="other">Other</label>
            </div>
            <input type="email" class="box" placeholder="Enter your email" id="email" name="email" required>
            <input type="password" class="box" placeholder="Create password" id="password" name="password" required>
            <input type="password" class="box" placeholder="Confirm password" id="password" name="password_confirmation" required>
            <input type="number" class="box" placeholder="Enter your Phone number" id="number" name="number" required>
            <button  class="btn">Register now</button>
        </form>

        <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

        <!-- custom js file link  -->
        <!-- <script src="js/script.js"></script> -->
</body>

</html>
